<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>overpay</title>
    <link rel="alternate" hreflang="ro" href="ro/" />
    <link rel="alternate" hreflang="ru" href="ru/" />
    <link rel="alternate" hreflang="x-default" href="ro/" />
    <!--
      Language router. The real pages live at /ro/ and /ru/ with their content
      baked in (no flash). This page picks one and redirects:
        1. a previously chosen language (localStorage 'overpay.lang')
        2. otherwise the browser's preferred language
        3. otherwise Romanian.
    -->
    <script>
      (function () {
        var SUPPORTED = ['ro', 'ru'];
        function pick() {
          try {
            var saved = localStorage.getItem('overpay.lang');
            if (SUPPORTED.indexOf(saved) >= 0) return saved;
          } catch (e) {
            /* storage unavailable */
          }
          try {
            var navs =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || navigator.userLanguage || ''];
            for (var i = 0; i < navs.length; i++) {
              var c = (navs[i] || '').toLowerCase().slice(0, 2);
              if (SUPPORTED.indexOf(c) >= 0) return c;
            }
          } catch (e) {
            /* navigator unavailable */
          }
          return 'ro';
        }
        location.replace(pick() + '/');
      })();
    </script>
    <!-- No-JS fallback: send everyone to the Romanian page. -->
    <meta http-equiv="refresh" content="0; url=ro/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f6f7f9;
        color: #0b1220;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p>Redirecting… <a href="ro/">Română</a> · <a href="ru/">Русский</a></p>
  </body>
</html>
